# HPC 门户 nginx 配置
# 安装： cp deploy/nginx-hpc-portal.conf /etc/nginx/conf.d/hpc-portal.conf
#        nginx -t && systemctl reload nginx
# 生产建议启用 HTTPS（JWT / 在线终端 / cookie 都更安全）。

upstream hpc_backend { server 127.0.0.1:8000; }

server {
    listen 8088;              # 独立端口(80=默认站点, 8090=fileserver, 故用 8088)
    server_name _;            # 改成你的域名/主机名
    client_max_body_size 2g;  # 允许较大文件上传

    # gzip：压缩 d3plot 二进制资产(浮点数据约可再压 20-40%)与 JS/CSS/JSON。
    # 对慢链路尤其有用；model.bin 为 application/octet-stream 故须显式列入类型。
    gzip on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_min_length 1024;
    gzip_types application/octet-stream application/json text/plain application/javascript text/css image/svg+xml;

    # 前端静态（pnpm build 产物）
    root /opt/hpc-portal/frontend/dist;
    index index.html;

    # 文件下载 / 打包流：单独关 gzip。
    # gzip 与 HTTP Range 互斥，关掉后浏览器/下载器可断点续传、多线程下载；
    # 且大文件多为已压缩格式，gzip 只会白耗 CPU 拖慢传输。
    # 前缀同时覆盖 /api/fs/download 与 /api/fs/download-archive-stream。
    location /api/fs/download {
        gzip off;
        proxy_pass http://hpc_backend/fs/download;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # API：前端用 /api 前缀；此处剥掉 /api 转发到后端（后端路由不含 /api）
    # proxy_pass 末尾带 / => 自动去掉 location 前缀
    location /api/ {
        proxy_pass http://hpc_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 1800s;     # d3plot 解析/打包等长任务
        proxy_send_timeout 1800s;
    }

    # WebSocket：任务进度 /ws/tasks、在线终端 /ws/shell —— 保留完整路径(无末尾/)
    location /ws/ {
        proxy_pass http://hpc_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;    # 终端长连接
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
